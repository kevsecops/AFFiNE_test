query matchWorkspaceDocs($contextId: String, $content: String!, $limit: SafeInt, $threshold: Float) {
  currentUser {
    copilot {
      contexts(contextId: $contextId) {
        matchWorkspaceDocs(content: $content, limit: $limit, threshold: $threshold) {
          docId
          chunk
          content
          distance
        }
      }
    }
  }
}